services:
  db:
    image: postgres:15-alpine
    container_name: idempotent_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: transaction_processor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transaction_processor"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: idempotent_app
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/transaction_processor
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
